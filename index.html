        /* CONTAINER VIDEO */
        .video-wrapper {
            width: 100%;
            max-width: 420px;
            /* Kalkulasi tinggi agar pas di layar HP tanpa scroll berlebih */
            height: calc(100vh - 320px); 
            max-height: 650px;
            background: #000;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);

        video {

            object-fit: contain; /* 'contain' agar video tidak terpotong jika aspek rasio beda */

        }

        /* Sembunyikan tombol yang tidak perlu */
        video::-webkit-media-controls-fullscreen-button,
        video::-webkit-media-controls-picture-in-picture-button {
            display: none !important;
        }

        @media (max-width: 480px) {
            .video-wrapper {
